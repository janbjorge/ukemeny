[project]
name = "matris"
version = "0.1.0"
description = "Middager fra matprat.no som passer kostholdet vårt, med ukens tilbud fra mattilbud.no"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "pydantic>=2.13",
    "orjson>=3.13",
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
    "logfire[fastapi,system-metrics]>=5.2.0",
    "opentelemetry-instrumentation-jinja2>=0.66b1",
]

[project.scripts]
matris = "adapters.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/app", "src/adapters", "src/pipeline"]

[dependency-groups]
# Offline build of datasets/ with Jev (src/pipeline). Not needed to serve the site.
pipeline = [
    "httpx2[http2]>=2.13.1",
    "tqdm>=4.70.1",
    "typesafe-sdk>=0.7.2",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "ty",
    "types-pyyaml",
    "mypy>=2.4.0",
    "types-tqdm>=4.70.0.20260906",
]

[tool.uv]
default-groups = ["pipeline", "dev"]

[tool.ruff]
line-length = 140
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "SIM", "RUF", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# jb 2026-10-13: "our application is mypy in strict mode and any is banned!" (also [tool.mypy] disallow_any_explicit)
"typing.Any".msg = "Any is banned: name the type (a TypedDict for JSON, object for anything)"
"typing_extensions.Any".msg = "Any is banned: name the type (a TypedDict for JSON, object for anything)"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
disallow_any_explicit = true
mypy_path = "src"
explicit_package_bases = true
files = ["src", "tests"]

[tool.ty.environment]
python = ".venv"
