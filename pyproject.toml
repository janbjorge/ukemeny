[project]
name = "matris"
version = "0.1.0"
description = "Middager fra matprat.no som passer kostholdet vårt, med ukens tilbud fra mattilbud.no"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "pydantic>=2.13",
    "orjson>=3.13",
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
]

[project.scripts]
matris = "adapters.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/app", "src/adapters", "src/pipeline"]

[dependency-groups]
# Offline build of datasets/ with Jev (src/pipeline). Not needed to serve the site.
pipeline = ["httpx2[http2]>=2.13.1", "typesafe-sdk>=0.7.2"]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff", "ty", "types-pyyaml"]

[tool.uv]
default-groups = ["pipeline", "dev"]

[tool.ruff]
line-length = 140
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ty.environment]
python = ".venv"
